<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light"><title>NEXORA · Knowledge Engine</title>
  <style>
    :root{font-family:'DM Sans',sans-serif;color:#e8edf1;background:#0b1014;font-synthesis:none;--bg:#0b1014;--panel:#11191f;--panel2:#151f26;--line:#25323a;--text:#e8edf1;--muted:#83949e;--accent:#a5f1cb;--accent-dark:#163d31;--orange:#f1b784;--red:#ff8d8d;--radius:12px;--mono:'DM Mono',monospace;--title:'Manrope',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 83% -12%,#142b2b 0,transparent 40%),var(--bg);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;background:#0c1216}.brand{display:flex;align-items:center;gap:11px;padding:2px 12px 27px;color:var(--text);font:800 17px var(--title);letter-spacing:.075em}.mark{width:29px;height:29px;border:1px solid #518c71;border-radius:9px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,#173b31,#10201d);font-size:17px}.brand small{display:block;color:#77858c;font:500 9px 'DM Mono',monospace;letter-spacing:.12em;margin-top:2px}.section-label{color:#64747d;font:500 10px var(--mono);letter-spacing:.1em;padding:13px 12px 8px}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:#9cabb2;text-align:left;border-radius:8px;padding:10px 12px;display:flex;gap:11px;align-items:center;font-size:13px;transition:.18s}.nav button:hover{background:#141d23;color:#e9f1f4}.nav button.active{background:#17271f;color:var(--accent)}.icon{width:16px;text-align:center;color:#80939c;font-size:14px}.active .icon{color:var(--accent)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0}.connection{display:flex;align-items:center;gap:8px;color:#92a19f;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#e6ae73}.dot.on{background:#85e7b0;box-shadow:0 0 8px #85e7b055}.key-open{margin-top:12px;border:1px solid var(--line);background:transparent;border-radius:7px;color:#a7b6bc;padding:8px 10px;width:100%;font-size:11px}.main{min-width:0}.topbar{height:69px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;background:#0b1014eF;backdrop-filter:blur(12px);z-index:2}.crumb{color:#718089;font-size:12px}.crumb strong{font-weight:500;color:#e2e9ec}.top-actions{display:flex;gap:10px;align-items:center}.time{font:11px var(--mono);color:#718089}.theme,.mobile-menu{border:1px solid var(--line);background:var(--panel);color:#abb8be;border-radius:8px;padding:8px 10px}.mobile-menu{display:none}.content{max-width:1440px;margin:auto;padding:34px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:27px}.eyebrow{color:var(--accent);font:500 10px var(--mono);letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}.page-head h1{font:700 27px var(--title);letter-spacing:-.04em;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:7px}.btn{border:1px solid #426c5b;background:#17382d;color:var(--accent);padding:10px 14px;border-radius:8px;font-weight:600;font-size:12px;transition:.18s}.btn:hover{background:#204938;transform:translateY(-1px)}.btn.secondary{border-color:var(--line);background:var(--panel);color:#c2cdd1}.btn.warn{border-color:#68453d;background:#38231f;color:#ffb2a0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card,.panel{background:linear-gradient(150deg,#121b20,#10171c);border:1px solid var(--line);border-radius:var(--radius)}.metric{padding:17px 18px;min-height:125px;position:relative;overflow:hidden}.metric:after{content:'';position:absolute;width:86px;height:86px;border:1px solid #263e37;border-radius:50%;right:-35px;top:-39px;box-shadow:0 0 0 12px #17231f,0 0 0 24px #131d1b}.metric-label{font-size:11px;color:#8e9ca2}.metric-value{font:700 29px var(--title);margin-top:15px;letter-spacing:-.04em}.metric-foot{font:10px var(--mono);color:#789188;margin-top:5px}.overview-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:14px;margin-top:15px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel-title{font:600 13px var(--title)}.panel-note{font-size:11px;color:var(--muted)}.activity{display:grid;gap:0}.activity-row{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #202a30}.activity-icon{width:31px;height:31px;border-radius:9px;background:#1a2d26;display:grid;place-items:center;color:var(--accent);font-size:12px}.activity-title{font-size:12px;color:#d5dfe2}.activity-meta{color:#819099;font-size:10px;margin-top:4px}.activity-time{font:10px var(--mono);color:#78868d}.empty{padding:28px 8px;text-align:center;color:#8b9aa1;font-size:12px;border:1px dashed #304047;border-radius:9px}.integrations{display:grid;gap:10px}.integration{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;background:#0e1519;border:1px solid #202b31;border-radius:8px}.integration strong{font-size:11px;font-weight:500}.badge{font:10px var(--mono);padding:4px 7px;border-radius:5px;color:#93a2a8;background:#1d282e}.badge.good{color:var(--accent);background:#183329}.badge.pending{color:var(--orange);background:#33271c}.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:15px}.field{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0d1418;color:var(--text);font-size:12px;outline:none}.field:focus{border-color:#527e69;box-shadow:0 0 0 3px #26453655}.search{max-width:430px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font:10px var(--mono);color:#788991;text-transform:uppercase;letter-spacing:.07em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{font-size:12px;padding:12px 10px;border-bottom:1px solid #1e292f;color:#cad4d7;vertical-align:middle}.table tr:last-child td{border:0}.table .muted{font-size:10px;color:#84939a;margin-top:4px}.mono{font:10px var(--mono);color:#84939a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.label{font-size:10px;color:#94a2a8;display:block;margin:0 0 6px 2px}.form-block{display:grid;gap:12px}.result{background:#0b1216;border:1px solid #26343b;border-radius:9px;overflow:hidden}.result-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid #26343b}.result-body{padding:13px;color:#d1dadd;font-size:12px;line-height:1.6}.result-body pre{white-space:pre-wrap;word-break:break-word;color:#c2ded0;font:11px/1.65 var(--mono);margin:0}.doc-title{font:600 13px var(--title);color:#e3ecee}.source-link{color:#8ddab0;text-decoration:none}.source-link:hover{text-decoration:underline}.toast{position:fixed;right:22px;bottom:22px;z-index:9;background:#20332b;color:#c6f6dc;border:1px solid #3e6d58;padding:12px 16px;border-radius:9px;font-size:12px;box-shadow:0 12px 35px #0007;animation:rise .2s ease}.toast.error{background:#38231f;color:#ffc2b3;border-color:#68453d}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.skeleton{color:transparent;background:linear-gradient(90deg,#182227 25%,#253138 50%,#182227 75%);background-size:200% 100%;animation:shine 1.4s infinite;border-radius:5px}@keyframes shine{to{background-position:-200% 0}}.light{--bg:#f2f5f4;--panel:#fff;--panel2:#f8faf9;--line:#dce5e1;--text:#1b2924;--muted:#687a72;--accent:#18744c;background:radial-gradient(ellipse at 83% -12%,#e0f2e8 0,transparent 40%),var(--bg);color:var(--text)}.light .sidebar,.light .topbar{background:#f7faf8}.light .card,.light .panel{background:linear-gradient(150deg,#fff,#f8faf9)}.light .field,.light .result{background:#f8faf9;color:#24332d}.light .integration{background:#f5f8f6}.light .nav button.active{background:#e1f2e8}.light .brand{color:#17261f}.light .metric-foot,.light .eyebrow{color:#28845d}
    @media(max-width:1020px){.cards{grid-template-columns:repeat(2,1fr)}.overview-grid{grid-template-columns:1fr}.content{padding:27px 23px}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:250px;transform:translateX(-102%);transition:.22s;box-shadow:16px 0 45px #0007}.sidebar.open{transform:none}.mobile-menu{display:block}.topbar{padding:0 16px}.content{padding:24px 15px}.page-head{align-items:flex-start;flex-direction:column}.cards{gap:9px}.metric{padding:14px;min-height:110px}.metric-value{font-size:25px}.section-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.time{display:none}.panel{padding:15px}}
  </style>
</head>
<body><div class="shell">
  <aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">✳</div><div>NEXORA<small>KNOWLEDGE ENGINE</small></div></div>
    <div class="section-label">PLATFORM</div><nav class="nav" id="nav">
      <button data-page="overview" class="active"><span class="icon">◫</span>Overview</button>
      <button data-page="collection"><span class="icon">⌁</span>Live collection</button>
      <button data-page="explorer"><span class="icon">⌕</span>Knowledge explorer</button>
      <button data-page="processing"><span class="icon">⟳</span>Data processing</button>
      <button data-page="sources"><span class="icon">▤</span>Sources</button>
      <button data-page="graph"><span class="icon">⌘</span>Knowledge graph</button>
      <div class="section-label">DEVELOPER</div>
      <button data-page="keys"><span class="icon">⚿</span>API management</button>
      <button data-page="playground"><span class="icon">▹</span>API playground</button>
      <button data-page="monitoring"><span class="icon">⌁</span>System monitoring</button>
      <button data-page="settings"><span class="icon">⚙</span>Settings</button>
    </nav>
    <div class="side-bottom"><div class="connection"><i id="connDot" class="dot"></i><span id="connText">Connect API key to begin</span></div><button class="key-open" id="openKey">Configure connection ↗</button></div>
  </aside>
  <main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="mobile-menu" id="menu">☰</button><div class="crumb">Platform <span style="color:#526169">/</span> <strong id="crumb">Overview</strong></div></div><div class="top-actions"><span class="time" id="clock"></span><button class="theme" id="theme" title="Toggle color theme">◐</button></div></header>
    <div class="content" id="content"><div class="empty">Connect a private API key to load live platform data.</div></div>
  </main>
</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('nexora_key')||'',page='overview',cache={};
const names={overview:'Overview',collection:'Live collection',explorer:'Knowledge explorer',processing:'Data processing',sources:'Sources',graph:'Knowledge graph',keys:'API management',playground:'API playground',monitoring:'System monitoring',settings:'Settings'};
function toast(s,bad=false){const t=$('#toast');t.innerHTML=`<div class="toast ${bad?'error':''}">${esc(s)}</div>`;setTimeout(()=>t.innerHTML='',3200)}
async function api(path,opts={}){if(!token)throw Error('Add an API key to continue');const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opts.headers}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||`Request failed (${r.status})`);return d}
function setConnected(ok){$('#connDot').classList.toggle('on',ok);$('#connText').textContent=ok?'Private API connected':'Connection unavailable'}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">NEXORA / ${esc(title)}</div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>${action}</div>`}
function metric(label,value,foot){return `<div class="card metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${value??'—'}</div><div class="metric-foot">${esc(foot)}</div></div>`}
function docRows(rows){if(!rows?.length)return `<tr><td colspan="4"><div class="empty">No documents yet. Add a source or collect a public URL.</div></td></tr>`;return rows.map(d=>`<tr><td><div class="doc-title">${esc(d.title)}</div><div class="muted">${esc((d.categories||[]).join(' · ')||d.publisher||'Unclassified')}</div></td><td><a class="source-link" href="${esc(d.source_url||'#')}" target="_blank" rel="noreferrer">${esc(new URL(d.source_url||location.href).hostname)}</a></td><td>${d.collected_at?new Date(d.collected_at).toLocaleDateString():'—'}</td><td><span class="badge good">${esc(d.status||'processed')}</span></td></tr>`).join('')}
function table(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Document</th><th>Source</th><th>Collected</th><th>Status</th></tr></thead><tbody>${docRows(rows)}</tbody></table></div>`}
async function render(){ $('#crumb').textContent=names[page];$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');if(!token){connectionView();return}$('#content').innerHTML='<div class="empty">Loading live service data…</div>';try{await ({overview:showOverview,collection:showCollection,explorer:showExplorer,processing:showProcessing,sources:showSources,graph:showGraph,keys:showKeys,playground:showPlayground,monitoring:showMonitoring,settings:showSettings}[page]||showOverview)();setConnected(true)}catch(e){setConnected(false);$('#content').innerHTML=`${pageHead(names[page],'The service did not return the requested data.')}<div class="panel"><div class="empty">${esc(e.message)}<br><br><button class="btn secondary" onclick="openKeyDialog()">Check API connection</button></div></div>`}}
function connectionView(){setConnected(false);$('#content').innerHTML=`${pageHead('Connect your knowledge engine','Authenticate the private console with an API key created for this NEXORA instance.')}<div class="panel" style="max-width:640px"><div class="panel-title">Private connection</div><p class="sub">The key stays in this browser tab and is sent only to this service.</p><div class="form-block"><div><label class="label">API base URL</label><input id="baseUrl" class="field" value="${esc(location.origin)}" disabled></div><div><label class="label">Bearer API key</label><input id="keyInput" class="field" type="password" placeholder="nxr_… or bootstrap key" autocomplete="off"></div><button class="btn" onclick="connect()">Connect securely</button></div></div>`}
async function connect(){const t=$('#keyInput').value.trim();if(!t)return toast('Paste an API key first.',true);token=t;sessionStorage.setItem('nexora_key',t);await render();if($('#connDot').classList.contains('on'))toast('Connected to NEXORA')}
function openKeyDialog(){connectionView();$('#keyInput')?.focus()}
async function showOverview(){const d=await api('/v1/admin/overview'),status=await api('/v1/system/status');$('#content').innerHTML=`${pageHead('Knowledge overview','Your private intelligence layer, at a glance.',`<button class="btn" onclick="page='sources';render()">＋ Add a source</button>`)}<div class="cards">${metric('Knowledge documents',d.documents,d.processed_documents+' processed')}${metric('Active sources',d.sources,d.worker_status)}${metric('Collected · 24 hours',d.collected_last_24h,'New and updated records')}${metric('API requests',d.api_requests,d.avg_retrieval_latency_ms?`Avg ${d.avg_retrieval_latency_ms} ms latency`:'No retrieval latency yet')}</div><div class="overview-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Recently collected</div><div class="panel-note" style="margin-top:4px">Latest source-backed records</div></div><button class="btn secondary" onclick="page='explorer';render()">Explore ↗</button></div><div class="activity">${d.recent_documents?.length?d.recent_documents.map(x=>`<div class="activity-row"><div class="activity-icon">◈</div><div><div class="activity-title">${esc(x.title)}</div><div class="activity-meta">${esc((x.categories||[]).join(' · ')||x.publisher||'Source document')}</div></div><div class="activity-time">${x.collected_at?new Date(x.collected_at).toLocaleDateString():'—'}</div></div>`).join(''):`<div class="empty">Your knowledge base is ready for its first source.</div>`}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Engine services</div><div class="panel-note" style="margin-top:4px">Live integration state</div></div><span class="badge good">${esc(status.status)}</span></div><div class="integrations"><div class="integration"><strong>Relational database</strong><span class="badge good">Connected</span></div><div class="integration"><strong>RSS collection worker</strong><span class="badge ${status.workers.rss_collector.startsWith('separate')?'pending':'good'}">${status.workers.rss_collector.startsWith('separate')?'Run worker':'Ready'}</span></div><div class="integration"><strong>Semantic vector search</strong><span class="badge pending">Not configured</span></div><div class="integration"><strong>Answer generation</strong><span class="badge pending">Not configured</span></div></div><div style="margin-top:16px;color:#83949e;font-size:11px;line-height:1.6">Service metrics reflect database records and request logs. Optional integrations are labeled until configured.</div></section></div>`}
async function showSources(){const rows=await api('/v1/admin/sources');$('#content').innerHTML=`${pageHead('Sources','Manage permitted feeds and public sources. Collection follows robots.txt and configured source terms.')}<div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Configured sources</div><div class="panel-note" style="margin-top:4px">${rows.length} source${rows.length===1?'':'s'} registered</div></div></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Source</th><th>Type</th><th>Docs</th><th>State</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="doc-title">${esc(s.name)}</div><div class="muted">${esc(s.url)}</div><div class="muted">${esc(s.license_notes||'No licensing note')}</div></td><td>${esc(s.kind)}</td><td>${s.documents}</td><td><span class="badge ${s.enabled?'good':'pending'}">${s.enabled?'Enabled':'Paused'}</span></td><td><button class="btn secondary" onclick="toggleSource('${s.id}',${!s.enabled})">${s.enabled?'Pause':'Enable'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sources configured yet. Add an RSS or Atom feed to start collection.</div>`}</section><section class="panel"><div class="panel-head"><div><div class="panel-title">Register a source</div><div class="panel-note" style="margin-top:4px">Sources must allow this use under their terms.</div></div></div><form class="form-block" id="sourceForm"><div><label class="label">Display name</label><input name="name" required class="field" placeholder="Research feed"></div><div><label class="label">Feed or public page URL</label><input name="url" required type="url" class="field" placeholder="https://example.org/feed.xml"></div><div class="form-grid"><div><label class="label">Connector type</label><select class="field" name="kind"><option value="rss">RSS / Atom</option><option value="website">Website (manual only)</option></select></div><div><label class="label">Poll interval</label><select class="field" name="interval_seconds"><option value="3600">Every hour</option><option value="21600">Every 6 hours</option><option value="86400">Daily</option></select></div></div><div><label class="label">License and permission notes</label><input name="license_notes" class="field" placeholder="Terms, license, or permission basis"></div><button class="btn">Save source</button></form></section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">One-time public collection</div><div class="panel-note" style="margin-top:4px">Checks the source host and robots policy. Redirects and private hosts are blocked.</div></div></div><form class="toolbar" id="collectForm"><input name="url" required type="url" class="field" placeholder="https://public.example.org/article"><button class="btn">Collect and process</button></form></section>`;
$('#sourceForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.interval_seconds=+x.interval_seconds;try{await api('/v1/admin/sources',{method:'POST',body:JSON.stringify(x)});toast('Source registered');showSources()}catch(err){toast(err.message,true)}};$('#collectForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));try{const r=await api('/v1/admin/collect',{method:'POST',body:JSON.stringify(x)});toast(r.stored?'Document collected and processed':'Content was unchanged or already stored');page='explorer';render()}catch(err){toast(err.message,true)}}}
async function toggleSource(id,enabled){try{await api(`/v1/admin/sources/${id}?enabled=${enabled}`,{method:'PATCH'});showSources()}catch(e){toast(e.message,true)}}
async function showExplorer(q=''){const data=await api('/v1/admin/documents?q='+encodeURIComponent(q));$('#content').innerHTML=`${pageHead('Knowledge explorer','Search collected documents and inspect their provenance.')}<section class="panel"><div class="toolbar"><input id="docSearch" class="field search" placeholder="Search titles, text, or source URLs…" value="${esc(q)}"><span class="panel-note">${data.results.length} records on this page</span></div>${table(data.results)}<div id="docDetail" style="margin-top:14px"></div></section>`;let tm;$('#docSearch').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>showExplorer(e.target.value),250)};document.querySelectorAll('.table tbody tr').forEach((tr,i)=>{const d=data.results[i];if(d)tr.style.cursor='pointer',tr.onclick=()=>detailDoc(d.document_id)})}
async function detailDoc(id){try{const d=await api('/v1/knowledge/documents/'+id);$('#docDetail').innerHTML=`<div class="result"><div class="result-head"><strong class="doc-title">${esc(d.title)}</strong><span class="badge good">${esc(d.status)}</span></div><div class="result-body"><p>${esc(d.summary)}</p><div class="mono">SOURCE · <a class="source-link" href="${esc(d.source_url)}" target="_blank" rel="noreferrer">${esc(d.source_url)}</a></div><p class="mono">Collected ${esc(d.collected_at)} · Quality: ${esc(JSON.stringify(d.quality))}</p><details><summary>View extracted text</summary><p>${esc(d.content)}</p></details></div></div>`}catch(e){toast(e.message,true)}}
async function showPlayground(){const usage=await api('/v1/account/usage');$('#content').innerHTML=`${pageHead('API playground','Query your own corpus with the same private API your applications use.')}<div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Knowledge query</div><div class="panel-note" style="margin-top:4px">Current key: ${esc(usage.name)} · ${esc(usage.requests_last_30_days)} requests in 30 days</div></div></div><form id="queryForm" class="form-block"><div><label class="label">Question or search phrase</label><textarea name="query" class="field" rows="4" required placeholder="What does the knowledge base say about…"></textarea></div><div class="form-grid"><div><label class="label">Retrieval mode</label><select class="field" name="search_mode"><option>hybrid</option><option>keyword</option><option>semantic</option></select></div><div><label class="label">Maximum results</label><select class="field" name="max_results"><option>5</option><option selected>10</option><option>20</option></select></div></div><label style="font-size:11px;color:#aab8bd"><input type="checkbox" name="include_sources" checked> Include source metadata</label><button class="btn">Run query →</button></form></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Evidence response</div><div class="panel-note" style="margin-top:4px">Results cite the original stored source.</div></div></div><div id="queryResult" class="empty">Submit a query to inspect retrieved context.</div></section></div>`;$('#queryForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.max_results=+f.max_results;f.include_sources=!!f.include_sources;const box=$('#queryResult');box.innerHTML='Searching stored knowledge…';const t=performance.now();try{const res=await api('/v1/knowledge/query',{method:'POST',body:JSON.stringify(f)});box.className='result';box.innerHTML=`<div class="result-head"><span class="badge good">${res.metadata.results_count} evidence records</span><span class="mono">${(performance.now()-t).toFixed(0)} ms</span></div><div class="result-body">${res.results.length?res.results.map(x=>`<article style="padding:8px 0 13px;border-bottom:1px solid #26343b"><div class="doc-title">${esc(x.title)}</div><p>${esc(x.summary)}</p><a class="source-link" href="${esc(x.source_url)}" target="_blank" rel="noreferrer">${esc(x.source_url)}</a><span class="mono"> · score ${x.relevance_score}</span></article>`).join(''):'No matching evidence found in the current corpus.'}<details style="margin-top:12px"><summary>Response JSON</summary><pre style="white-space:pre-wrap;font:10px var(--mono)">${esc(JSON.stringify(res,null,2))}</pre></details></div>`}catch(err){box.className='empty';box.textContent=err.message}}}
async function showKeys(){const rows=await api('/v1/admin/keys');$('#content').innerHTML=`${pageHead('API management','Create private access keys. Secret values are revealed once, at creation.')}<section class="panel"><div class="panel-head"><div><div class="panel-title">Access keys</div><div class="panel-note" style="margin-top:4px">Stored as one-way hashes</div></div><button class="btn" onclick="createKey()">＋ Create key</button></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Permissions</th><th>Requests</th><th>Last used</th><th>State</th><th></th></tr></thead><tbody>${rows.map(k=>`<tr><td>${esc(k.name)}<div class="muted">Created ${new Date(k.created_at).toLocaleDateString()}</div></td><td>${esc(k.permissions.join(', '))}</td><td>${k.request_count}</td><td>${k.last_used_at?new Date(k.last_used_at).toLocaleString():'Never'}</td><td><span class="badge ${k.active?'good':'pending'}">${k.active?'Active':'Revoked'}</span></td><td>${k.active?`<button class="btn warn" onclick="revokeKey('${k.id}')">Revoke</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No keys found.</div>`}</section>`}
async function createKey(){const name=prompt('Name this key');if(!name)return;const perms=prompt('Permissions: read, write, or admin','read');if(!perms)return;try{const result=await api('/v1/admin/keys',{method:'POST',body:JSON.stringify({name,permissions:perms.split(',').map(s=>s.trim())})});await showKeys();$('#content').insertAdjacentHTML('afterbegin',`<div class="panel" style="margin-bottom:14px;border-color:#527e69"><div class="panel-title">Save this API key now · it will not be shown again</div><div class="toolbar" style="margin-top:10px"><input id="newSecret" class="field" readonly value="${esc(result.secret)}"><button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('#newSecret').value).then(()=>toast('Key copied'))">Copy</button><button class="btn secondary" onclick="this.closest('.panel').remove()">Dismiss</button></div></div>`)}catch(e){toast(e.message,true)}}
async function revokeKey(id){if(!confirm('Revoke this key immediately? Existing clients will lose access.'))return;try{await api('/v1/admin/keys/'+id,{method:'DELETE'});toast('Key revoked');showKeys()}catch(e){toast(e.message,true)}}
async function showCollection(){const [sources,jobs]=await Promise.all([api('/v1/admin/sources'),api('/v1/admin/jobs')]);$('#content').innerHTML=`${pageHead('Live collection','Source schedules and persistent collection job history.',`<button class="btn" onclick="page='sources';render()">＋ Manage sources</button>`)}<div class="cards">${metric('Registered sources',sources.length,'Configured in NEXORA')}${metric('Enabled feeds',sources.filter(x=>x.enabled&&x.kind==='rss').length,'RSS / Atom polling')}${metric('Recent jobs',jobs.length,'Last 50 stored jobs')}${metric('Failed jobs',jobs.filter(x=>x.state==='failed').length,'Inspect error details below')}</div><section class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title">Collection history</div><span class="badge pending">Worker is a separate process</span></div>${jobs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Started</th><th>Source</th><th>State</th><th>Discovered</th><th>Stored</th><th>Details</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${new Date(j.started_at).toLocaleString()}</td><td>${esc(sources.find(s=>s.id===j.source_id)?.name||j.source_id)}</td><td><span class="badge ${j.state==='completed'?'good':'pending'}">${esc(j.state)}</span></td><td>${j.discovered}</td><td>${j.collected}</td><td>${esc(j.error||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No jobs recorded. Run the collector process after adding RSS sources.</div>`}</section>`}
async function showProcessing(){const [o,j]=await Promise.all([api('/v1/admin/overview'),api('/v1/admin/jobs')]);const stages=['Discovery','Collection','Extraction','Cleaning','Classification','Enrichment','Embedding','Indexing'];$('#content').innerHTML=`${pageHead('Data processing','Pipeline state derived from real stored documents and collection jobs.')}<div class="panel"><div class="panel-head"><div class="panel-title">Processing stages</div><span class="badge good">${o.processed_documents} documents processed</span></div><div class="integrations">${stages.map((s,i)=>`<div class="integration"><strong><span class="mono">0${i+1}</span> &nbsp; ${s}</strong><span class="badge ${i<5?'good':'pending'}">${i<5?(i===0?o.sources:i===1?o.documents:o.processed_documents):'Not configured'}</span></div>`).join('')}</div><p class="panel-note" style="line-height:1.7;margin-top:14px">Extraction, cleaning, conservative category assignment, fingerprint deduplication, summaries, and database persistence run when documents are collected. Entity enrichment and vector embeddings require their provider modules.</p><div class="panel-title" style="margin-top:22px">Failed jobs (${j.filter(x=>x.state==='failed').length})</div><div class="activity" style="margin-top:10px">${j.filter(x=>x.state==='failed').map(x=>`<div class="activity-row"><div class="activity-icon" style="color:#ff9b83;background:#34221e">!</div><div><div class="activity-title">${esc(x.error||'Collection failed')}</div><div class="activity-meta">${new Date(x.started_at).toLocaleString()}</div></div></div>`).join('')||'<div class="empty">No failed jobs in the recorded history.</div>'}</div></div>`}
async function showMonitoring(){const m=await api('/v1/admin/monitoring');$('#content').innerHTML=`${pageHead('System monitoring','Measured service health and request data. Unavailable integrations are identified explicitly.')}<div class="cards">${metric('API requests',m.api_requests,'Recorded private requests')}${metric('Average latency',m.average_latency_ms?m.average_latency_ms+' ms':'—','Across recorded API calls')}${metric('Database',m.database,'Connection check succeeded')}${metric('Semantic index',m.semantic_index,'Provider not installed')}</div><section class="panel" style="margin-top:14px"><div class="panel-title">Service checks</div><div class="integrations" style="margin-top:13px"><div class="integration"><strong>Database</strong><span class="badge good">${esc(m.database)}</span></div><div class="integration"><strong>Redis queue</strong><span class="badge pending">${esc(m.queue)}</span></div><div class="integration"><strong>Vector search</strong><span class="badge pending">${esc(m.semantic_index)}</span></div></div></section>`}
async function showGraph(){await api('/v1/admin/overview');$('#content').innerHTML=`${pageHead('Knowledge graph','Entity linking is an extension point in this release.')}<div class="panel"><div class="empty"><div style="font-size:25px;margin-bottom:12px">⌘</div>Entity extraction and graph storage are not configured yet.<br><br>Documents, sources, and provenance are available in the explorer.</div></div>`}
async function showSettings(){const status=await api('/v1/system/status');$('#content').innerHTML=`${pageHead('Settings','Runtime configuration and installed integrations.')}<div class="section-grid"><section class="panel"><div class="panel-title">Knowledge engine</div><div class="integrations" style="margin-top:14px"><div class="integration"><strong>Service name</strong><span class="badge">${esc(status.name)}</span></div><div class="integration"><strong>Environment</strong><span class="badge">${esc(status.status)}</span></div><div class="integration"><strong>Database</strong><span class="badge good">${esc(status.database)}</span></div><div class="integration"><strong>Collection worker</strong><span class="badge pending">Separate process</span></div></div></section><section class="panel"><div class="panel-title">Provider configuration</div><div class="empty" style="margin-top:14px">No AI provider credentials are stored. Provider settings are not enabled yet; no secrets are sent to the browser.</div></section></div>`}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render()});$('#theme').onclick=()=>document.body.classList.toggle('light');$('#openKey').onclick=openKeyDialog;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#clock').textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());
if(token){render();}else connectionView();
</script></body></html>
