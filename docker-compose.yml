services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nexora-data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/nexora.db}
    restart: unless-stopped
  collector:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - nexora-data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/nexora.db}
    depends_on:
      - api
    restart: unless-stopped
volumes:
  nexora-data:
